name: Build Docker Image

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build S13 Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Build Docker image
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          docker build --pull --tag "s13-training-camps:${commit_sha}" .
